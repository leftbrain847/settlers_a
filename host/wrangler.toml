name = "settlers-host"
main = "src/worker.ts"
compatibility_date = "2026-01-15"
# The workers.dev URL and preview URLs are the only addresses that reach this Worker; everything behind them
# is capability-checked in code. Turn these off if you later put a custom domain (and Cloudflare Access) in front.
workers_dev = true
preview_urls = false

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Static files are served by the platform for free; only the API and sockets run Worker code.
run_worker_first = ["/api/*", "/ws/*"]

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "GameRoom"

[[durable_objects.bindings]]
name = "PROFILES"
class_name = "ProfileStore"

[[durable_objects.bindings]]
name = "USAGE"
class_name = "UsageMeter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom", "ProfileStore", "UsageMeter"]
